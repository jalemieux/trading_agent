[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coinbase-trading-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coinbase-advanced-py>=1.8.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "groq>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
